name: 학습 이미지 빌드

# 학습 이미지는 CUDA 런타임과 모델 가중치를 포함해 10GB를 넘는다.
# 노트북에서 빌드·푸시하면 디스크와 업로드 시간이 모두 문제가 되므로
# GitHub Actions에서 빌드해 GHCR로 바로 올린다.
on:
  workflow_dispatch:
  push:
    branches: [backend, main]
    paths:
      - "training-container/**"
      - ".github/workflows/training-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 기본 러너의 여유 공간은 이 이미지에 빠듯하다. 쓰지 않는 툴체인을 먼저 지운다.
      - name: 디스크 확보
        run: |
          echo "정리 전"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          echo "정리 후"; df -h / | tail -1

      - uses: actions/checkout@v4

      - name: 이미지 이름 결정
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/unwork-sd15-lora" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드와 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./training-container
          platforms: linux/amd64
          push: true
          # attestation manifest 없이 단순한 이미지로 올린다. Runpod이 그대로 받는다.
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: 결과 안내
        run: |
          echo "### 학습 이미지 푸시 완료" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "MVP_TRAINING_IMAGE=${{ steps.image.outputs.name }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "이 이미지는 기본이 비공개다. Runpod이 받아가려면 패키지 설정에서 공개로 바꾼다." >> "$GITHUB_STEP_SUMMARY"
          df -h / | tail -1
